name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create signing key
        run: keytool -genkeypair -keystore "$GITHUB_WORKSPACE/livetv.jks" -alias livetv -keyalg RSA -keysize 2048 -validity 10000 -storepass livetv123 -keypass livetv123 -dname "CN=Live TV"
      - name: Build
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LiveTV-apk
          path: app/build/outputs/apk/release/*.apk
