<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--bg:#0e1424;--side:#141c33;--card:#f4f6fb;--ink:#e9edf8;--mute:#8a96b8;--acc:#4f7cff;--line:#243055}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,Roboto,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#side{width:240px;background:var(--side);padding:20px 12px;overflow-y:auto;flex-shrink:0}
#side h1{font-size:20px;padding:0 10px 14px}
.cat{display:flex;justify-content:space-between;width:100%;padding:11px 12px;margin-bottom:4px;border:0;border-radius:10px;background:none;color:var(--ink);font-size:15px;cursor:pointer;text-align:left}
.cat span{color:var(--mute)}
.cat.on{background:var(--acc)}
.cat.on span{color:#fff}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:10px;padding:16px 20px;align-items:center;border-bottom:1px solid var(--line)}
#top input{flex:1;min-width:0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--side);color:var(--ink);font-size:15px}
button.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--side);color:var(--ink);font-size:15px;cursor:pointer}
#grid{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;align-content:start}
.ch{background:none;border:0;color:var(--ink);cursor:pointer;font-size:12px;text-align:center}
.ch .lg{height:76px;background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:10px;margin-bottom:6px}
.ch img{max-width:100%;max-height:100%;object-fit:contain}
.ch .nm{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ch:focus-visible .lg{box-shadow:0 0 0 3px var(--acc)}
#msg{padding:30px;color:var(--mute)}
#player{position:fixed;inset:0;background:#000;display:none;z-index:5}
#player video{width:100%;height:100%}
#bar{position:absolute;top:0;left:0;right:0;padding:16px 22px;background:linear-gradient(#000c,transparent);display:flex;gap:12px;align-items:center;transition:opacity .3s}
#bar.hide{opacity:0}
#pname{flex:1;font-size:18px}
#perr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:20px;text-align:center;padding:30px}
@media(max-width:700px){#side{width:130px}.cat{font-size:13px;padding:9px 8px}}
</style>
</head>
<body>
<div id="app">
  <nav id="side"><h1>Live TV</h1><div id="cats"></div></nav>
  <div id="main">
    <div id="top">
      <input id="q" type="search" placeholder="Search channels">
      <button class="btn" id="pl">Playlist</button>
    </div>
    <div id="grid"></div>
  </div>
</div>
<div id="player">
  <video id="v" autoplay playsinline></video>
  <div id="perr"></div>
  <div id="bar">
    <button class="btn" id="back">Back</button>
    <div id="pname"></div>
    <button class="btn" id="prev">Prev</button>
    <button class="btn" id="next">Next</button>
  </div>
</div>
<script>
const DEFAULT_URL="https://iptv-org.github.io/iptv/countries/in.m3u";
const $=id=>document.getElementById(id);
let channels=[],cat="All",list=[],idx=-1,hls=null,barTimer;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let dead=new Set(JSON.parse(store.get("dead")||"[]"));

function parseM3U(t){
  const out=[],L=t.split(/\r?\n/);let cur=null;
  for(const raw of L){
    const l=raw.trim();
    if(l.startsWith("#EXTINF")){
      const a=k=>{const m=l.match(new RegExp(k+'="([^"]*)"'));return m?m[1]:""};
      cur={name:l.slice(l.lastIndexOf(",")+1).trim()||a("tvg-name"),logo:a("tvg-logo"),group:(a("group-title").split(";")[0])||"Other"};
    }else if(l&&!l.startsWith("#")&&cur){cur.url=l;out.push(cur);cur=null}
  }
  return out;
}
async function load(url){
  $("grid").innerHTML='<div id="msg">Loading channels…</div>';
  try{
    const r=await fetch(url);if(!r.ok)throw new Error(r.status);
    channels=parseM3U(await r.text());
    if(!channels.length)throw new Error("No channels found");
    store.set("url",url);cat="All";render();
  }catch(e){$("grid").innerHTML='<div id="msg">Could not load the playlist ('+e.message+'). Press Playlist to enter a different link.</div>'}
}
function render(){
  const counts={};channels.forEach(c=>counts[c.group]=(counts[c.group]||0)+1);
  const names=["All",...Object.keys(counts).sort()];
  $("cats").innerHTML="";
  names.forEach(n=>{
    const b=document.createElement("button");b.className="cat"+(n===cat?" on":"");
    const s=document.createElement("span");s.textContent=n==="All"?channels.length:counts[n];
    b.append(n,s);b.onclick=()=>{cat=n;render();$("grid").firstChild&&$("grid").firstChild.focus()};
    $("cats").append(b);
  });
  const q=$("q").value.toLowerCase();
  list=channels.filter(c=>(cat==="All"||c.group===cat)&&c.name.toLowerCase().includes(q)&&!dead.has(c.url));
  const g=$("grid");g.innerHTML="";g.scrollTop=0;
  if(!list.length){g.innerHTML='<div id="msg">No channels here.</div>';return}
  const f=document.createDocumentFragment();
  list.forEach((c,i)=>{
    const b=document.createElement("button");b.className="ch";
    const lg=document.createElement("div");lg.className="lg";
    if(c.logo){const im=document.createElement("img");im.src=c.logo;im.loading="lazy";im.alt="";im.onerror=()=>im.remove();lg.append(im)}
    const nm=document.createElement("span");nm.className="nm";nm.textContent=c.name;
    b.append(lg,nm);b.onclick=()=>play(i);f.append(b);
  });
  g.append(f);
}
function play(i){
  if(i<0||i>=list.length)return;
  idx=i;const c=list[i],v=$("v");
  $("player").style.display="block";$("pname").textContent=c.name;$("perr").style.display="none";
  if(hls){hls.destroy();hls=null}
  const fail=()=>{$("perr").style.display="flex";$("perr").textContent="This channel isn’t working. Press Next to try another, or Back to leave.";dead.add(c.url);store.set("dead",JSON.stringify([...dead]))};
  if(window.Hls&&Hls.isSupported()&&/\.m3u8|\.m3u/i.test(c.url)){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail()});
  }else{v.src=c.url;v.onerror=fail}
  v.play().catch(()=>{});
  showBar();$("next").focus();
}
function stop(){
  if(hls){hls.destroy();hls=null}
  const v=$("v");v.pause();v.removeAttribute("src");v.load();
  $("player").style.display="none";
  const b=$("grid").children[idx];if(b)b.focus();
}
function showBar(){$("bar").classList.remove("hide");clearTimeout(barTimer);barTimer=setTimeout(()=>$("bar").classList.add("hide"),4000)}
$("back").onclick=stop;$("next").onclick=()=>{showBar();play(idx+1)};$("prev").onclick=()=>{showBar();play(idx-1)};
$("q").oninput=render;
$("pl").onclick=()=>{
  const u=prompt("Playlist (.m3u) link:",store.get("url")||DEFAULT_URL);
  if(u){dead=new Set();store.set("dead","[]");load(u.trim())}
};

/* Remote / keyboard navigation: arrow keys move focus to the nearest control */
function move(dir){
  const root=$("player").style.display==="block"?$("player"):document;
  const els=[...root.querySelectorAll("button,input")].filter(e=>e.offsetParent!==null||e.closest("#bar"));
  const a=document.activeElement;
  if(!a||!els.includes(a)){els[0]&&els[0].focus();return}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bd=1e9;
  for(const e of els){
    if(e===a)continue;
    const b=e.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,dx=x-cx,dy=y-cy;
    const ok=dir==="Left"?dx<-4&&Math.abs(dy)<r.height:dir==="Right"?dx>4&&Math.abs(dy)<r.height:dir==="Up"?dy<-4:dy>4;
    if(!ok)continue;
    const d=dir==="Left"||dir==="Right"?Math.abs(dx)+Math.abs(dy)*3:Math.abs(dy)+Math.abs(dx)*3;
    if(d<bd){bd=d;best=e}
  }
  if(best){best.focus();best.scrollIntoView({block:"nearest"})}
}
addEventListener("keydown",e=>{
  if(e.target.id==="q"&&(e.key==="ArrowLeft"||e.key==="ArrowRight"))return;
  if(e.key.startsWith("Arrow")){e.preventDefault();if($("player").style.display==="block")showBar();move(e.key.slice(5))}
  else if(e.key==="Escape"||e.key==="Backspace"||e.key==="GoBack"){
    if($("player").style.display==="block"){e.preventDefault();stop()}
  }
  else if($("player").style.display==="block"){
    if(e.key==="ChannelUp"||e.key==="PageUp")play(idx+1);
    if(e.key==="ChannelDown"||e.key==="PageDown")play(idx-1);
  }
});
window.onBack=()=>{if($("player").style.display==="block"){stop();return true}return false};
load(store.get("url")||DEFAULT_URL);
</script>
</body>
</html>
