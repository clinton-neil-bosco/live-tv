plugins { id 'com.android.application' }
android {
    namespace 'com.livetv.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.livetv.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../livetv.jks')
            storePassword 'livetv123'
            keyAlias 'livetv'
            keyPassword 'livetv123'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
